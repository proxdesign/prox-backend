apiVersion: batch/v1
kind: CronJob
metadata:
  name: prox-data-collection
  namespace: prox-discovery
  labels:
    app.kubernetes.io/name: prox-data-collection
    app.kubernetes.io/component: collector
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: prox-data-collection
            app.kubernetes.io/component: collector
        spec:
          restartPolicy: OnFailure
          containers:
          - name: collector
            image: prox/data-collector:latest
            command:
            - python3
            - scripts/run_collection.py
            env:
            - name: PROX_ENV
              valueFrom:
                configMapKeyRef:
                  name: prox-config
                  key: PROX_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: prox-config
                  key: LOG_LEVEL
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: database-host
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: database-name
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: database-user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: database-password
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: database-port
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: anthropic-api-key
            - name: REDDIT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: reddit-client-id
            - name: REDDIT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: reddit-client-secret
            - name: YOUTUBE_DATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: youtube-api-key
            - name: PINTEREST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: pinterest-api-key
            resources:
              requests:
                memory: "512Mi"
                cpu: "500m"
              limits:
                memory: "1Gi"
                cpu: "1000m"
            volumeMounts:
            - name: logs
              mountPath: /app/logs
          volumes:
          - name: logs
            emptyDir: {}

