apiVersion: batch/v1
kind: CronJob
metadata:
  name: prox-health-check
  namespace: prox-discovery
  labels:
    app.kubernetes.io/name: prox-health-check
    app.kubernetes.io/component: monitor
spec:
  schedule: "*/30 * * * *"  # Every 30 minutes
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: prox-health-check
            app.kubernetes.io/component: monitor
        spec:
          restartPolicy: OnFailure
          containers:
          - name: health-checker
            image: prox/data-collector:latest
            command:
            - python3
            - scripts/run_collection.py
            - --test
            env:
            - name: PROX_ENV
              valueFrom:
                configMapKeyRef:
                  name: prox-config
                  key: PROX_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: prox-config
                  key: LOG_LEVEL
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: database-host
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: database-name
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: database-user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: database-password
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: database-port
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: prox-secrets
                  key: anthropic-api-key
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "200m"