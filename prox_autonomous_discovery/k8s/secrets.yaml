apiVersion: v1
kind: Secret
metadata:
  name: prox-secrets
  namespace: prox-discovery
type: Opaque
stringData:
  # Database Configuration
  database-host: "postgres-service.prox-discovery.svc.cluster.local"
  database-name: "prox_discovery"
  database-user: "postgres"
  database-password: "CHANGE_ME_IN_PRODUCTION"
  database-port: "5432"
  
  # API Keys (Replace with actual values)
  anthropic-api-key: "sk-ant-api03-CHANGE_ME"
  reddit-client-id: "CHANGE_ME"
  reddit-client-secret: "CHANGE_ME"
  youtube-api-key: "CHANGE_ME"
  pinterest-api-key: "CHANGE_ME"
  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prox-config
  namespace: prox-discovery
data:
  PROX_ENV: "production"
  LOG_LEVEL: "INFO"
  COLLECTION_FREQUENCY_HOURS: "6"