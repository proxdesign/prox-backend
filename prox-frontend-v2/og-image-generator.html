<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #5C7C5C 0%, #4A6A4A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        .container {
            text-align: center;
            color: white;
            max-width: 800px;
            padding: 40px;
        }
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            display: block;
            filter: brightness(0) invert(1);
        }
        .title {
            font-size: 72px;
            font-weight: bold;
            margin: 0 0 20px 0;
            letter-spacing: -2px;
        }
        .subtitle {
            font-size: 32px;
            font-weight: 400;
            margin: 0 0 30px 0;
            opacity: 0.9;
            line-height: 1.2;
        }
        .tagline {
            font-size: 24px;
            font-weight: 300;
            opacity: 0.8;
            margin: 0;
        }
        .accent {
            position: absolute;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        .accent2 {
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="accent"></div>
    <div class="accent2"></div>
    <div class="container">
        <img src="logo.png" alt="Prox Logo" class="logo">
        <h1 class="title">Prox</h1>
        <p class="subtitle">AI-Powered Home Product Discovery</p>
        <p class="tagline">Find products that actually work</p>
    </div>
</body>
</html>
